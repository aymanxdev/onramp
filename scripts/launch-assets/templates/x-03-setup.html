<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_400}}') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_600}}') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_700}}') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('{{FONT_MONO_400}}') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }

:root {
  --bg-page: #141413;
  --bg-raised: #24241f;
  --border-strong: #4a4941;
  --text-primary: #faf9f5;
  --text-muted: #918f86;
  --dot: rgba(250,249,245,.075);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1600px;
  height: 900px;
  background: var(--bg-page);
  background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: 22px 22px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  color: var(--text-primary);
  overflow: hidden;
  position: relative;
}

.wordmark { position: absolute; left: 80px; top: 40px; display: flex; align-items: center; gap: 10px; }
.wordmark svg { display: block; width: 24px; height: 26px; }
.wordmark span { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }

.caption {
  position: absolute;
  left: 80px;
  top: 96px;
  width: 1300px;
  font-weight: 600;
  font-size: 44px;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.frame {
  position: absolute;
  left: 440px;
  top: 250px;
  width: 720px;
  height: 560px;
  border-radius: 20px;
  overflow: hidden;
  background: var(--bg-raised);
  border: 1px solid var(--border-strong);
  box-shadow: 0 30px 70px rgba(0,0,0,.5);
}
.chrome {
  height: 44px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 18px;
  background: var(--bg-raised);
  border-bottom: 1px solid var(--border-strong);
}
.chrome span { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
.frame .screen { width: 100%; height: calc(100% - 44px); overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--bg-page); }
.frame .screen img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

.disclaimer {
  position: absolute;
  right: 80px;
  bottom: 40px;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-weight: 400;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--text-muted);
}
</style>
</head>
<body>

<div class="wordmark">
  <svg viewBox="28 24 74 82" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="44" cy="36" rx="9" ry="10" fill="#a3bd68" stroke="#141413" stroke-width="2.5"/>
    <ellipse cx="86" cy="36" rx="9" ry="10" fill="#a3bd68" stroke="#141413" stroke-width="2.5"/>
    <path d="M31 66 Q31 38 60 38 L70 38 Q99 38 99 66 L101 90 Q101 102 87 102 L43 102 Q29 102 29 90 Z" fill="#b5cd7a" stroke="#141413" stroke-width="2.5"/>
    <ellipse cx="51" cy="66" rx="8" ry="9.5" fill="#141413"/>
    <ellipse cx="79" cy="66" rx="8" ry="9.5" fill="#141413"/>
    <circle cx="54" cy="62" r="3" fill="#faf9f5"/>
    <circle cx="82" cy="62" r="3" fill="#faf9f5"/>
    <path d="M57 82 Q65 88 73 82" fill="none" stroke="#141413" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <span>Onramp</span>
</div>

<div class="caption">the bit nobody else does: it tells you which permission to say no to</div>

<div class="frame">
  <div class="chrome"><span></span><span></span><span></span></div>
  <div class="screen"><img src="{{SCREENSHOT}}" /></div>
</div>

<div class="disclaimer">Unofficial. Not affiliated with Anthropic.</div>

</body>
</html>
