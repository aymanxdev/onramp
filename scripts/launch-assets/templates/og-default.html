<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_400}}') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_600}}') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_700}}') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('{{FONT_MONO_400}}') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }

:root {
  --bg-page: #141413;
  --text-primary: #faf9f5;
  --text-secondary: #b0aea5;
  --text-muted: #918f86;
  --dot: rgba(250,249,245,.075);
  --lime-text: #cfe39c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1200px;
  height: 630px;
  background: var(--bg-page);
  background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: 22px 22px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  color: var(--text-primary);
  overflow: hidden;
  position: relative;
}

.wordmark { position: absolute; left: 80px; top: 64px; display: flex; align-items: center; gap: 12px; }
.wordmark .mark svg { display: block; width: 40px; height: 44px; }
.wordmark .word { font-weight: 700; font-size: 25px; letter-spacing: -0.02em; }

.copy { position: absolute; left: 80px; top: 190px; width: 610px; }
.headline {
  font-weight: 700;
  font-size: 53px;
  line-height: 1.08;
  letter-spacing: -0.03em;
}
.headline .route { color: var(--lime-text); }
.sub {
  margin-top: 26px;
  font-weight: 400;
  font-size: 21px;
  line-height: 1.5;
  color: var(--text-secondary);
  max-width: 540px;
}

.glow {
  position: absolute;
  right: -40px;
  top: 130px;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(181,205,122,.38), rgba(181,205,122,0) 70%);
  filter: blur(6px);
}
.mascot { position: absolute; right: 96px; top: 176px; width: 260px; height: 249px; }
.mascot svg { width: 100%; height: 100%; display: block; }

.disclaimer {
  position: absolute;
  left: 80px;
  bottom: 56px;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-weight: 400;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--text-muted);
}
</style>
</head>
<body>

<div class="wordmark">
  <span class="mark">
    <svg viewBox="28 24 74 82" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="44" cy="36" rx="9" ry="10" fill="#a3bd68" stroke="#141413" stroke-width="2.5"/>
      <ellipse cx="86" cy="36" rx="9" ry="10" fill="#a3bd68" stroke="#141413" stroke-width="2.5"/>
      <path d="M31 66 Q31 38 60 38 L70 38 Q99 38 99 66 L101 90 Q101 102 87 102 L43 102 Q29 102 29 90 Z" fill="#b5cd7a" stroke="#141413" stroke-width="2.5"/>
      <ellipse cx="51" cy="66" rx="8" ry="9.5" fill="#141413"/>
      <ellipse cx="79" cy="66" rx="8" ry="9.5" fill="#141413"/>
      <circle cx="54" cy="62" r="3" fill="#faf9f5"/>
      <circle cx="82" cy="62" r="3" fill="#faf9f5"/>
      <path d="M57 82 Q65 88 73 82" fill="none" stroke="#141413" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </span>
  <span class="word">Onramp</span>
</div>

<div class="copy">
  <div class="headline">Tell us what you are trying to do. We hand you the <span class="route">route</span>.</div>
  <div class="sub">The right surface, what to switch on, the exact first prompt. Free, no login.</div>
</div>

<div class="glow"></div>
<div class="mascot">

    <circle cx="82" cy="62" r="3" fill="#faf9f5"/>

    </g>
    <g transform="translate(94 86) rotate(8)">

    </g>
  </svg>
</div>

<div class="disclaimer">Unofficial. Not affiliated with Anthropic.</div>

</body>
</html>
