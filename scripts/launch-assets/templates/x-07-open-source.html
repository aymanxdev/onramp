<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_400}}') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_600}}') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_700}}') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('{{FONT_MONO_400}}') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('{{FONT_MONO_500}}') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }

:root {
  --bg-page: #141413;
  --bg-raised: #24241f;
  --border: #37372f;
  --border-strong: #4a4941;
  --text-primary: #faf9f5;
  --text-muted: #918f86;
  --dot: rgba(250,249,245,.075);
  --lime-text: #cfe39c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1600px;
  height: 900px;
  background: var(--bg-page);
  background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: 22px 22px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  color: var(--text-primary);
  overflow: hidden;
  position: relative;
}

.wordmark { position: absolute; left: 80px; top: 56px; display: flex; align-items: center; gap: 10px; }
.wordmark svg { display: block; width: 28px; height: 30px; }
.wordmark span { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }

.caption {
  position: absolute;
  left: 80px;
  top: 150px;
  width: 1200px;
  font-weight: 600;
  font-size: 44px;
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.caption .open { color: var(--lime-text); }

.mascot { position: absolute; left: 80px; bottom: 130px; width: 210px; height: 201px; }
.mascot svg { width: 100%; height: 100%; display: block; }

.cards {
  position: absolute;
  left: 340px;
  right: 80px;
  bottom: 150px;
  display: flex;
  gap: 24px;
}
.card {
  flex: 1;
  background: var(--bg-raised);
  border: 1px solid var(--border-strong);
  border-radius: 24px;
  padding: 30px 28px;
  box-shadow: 0 18px 44px rgba(0,0,0,.5);
}
.card .fact {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-weight: 500;
  font-size: 22px;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.disclaimer {
  position: absolute;
  left: 80px;
  bottom: 56px;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-weight: 400;
  font-size: 16px;
  letter-spacing: 0.02em;
  color: var(--text-muted);
}
</style>
</head>
<body>
