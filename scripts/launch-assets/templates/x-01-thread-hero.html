<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_400}}') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Sans'; src: url('{{FONT_SANS_700}}') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('{{FONT_MONO_400}}') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('{{FONT_MONO_500}}') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }

:root {
  --bg-page: #141413;
  --text-primary: #faf9f5;
  --text-muted: #918f86;
  --dot: rgba(250,249,245,.075);
  --bezel: #24241f;
  --bezel-edge: #4a4941;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1600px;
  height: 900px;
  background: var(--bg-page);
  background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: 22px 22px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  color: var(--text-primary);
  overflow: hidden;
  position: relative;
}

.wordmark { position: absolute; left: 80px; top: 56px; display: flex; align-items: center; gap: 10px; }
.wordmark svg { display: block; width: 28px; height: 30px; }
.wordmark span { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }

.stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; display: flex; align-items: center; padding: 0 80px; }
.copy { max-width: 680px; }
.headline {
  font-weight: 700;
  font-size: 60px;
  line-height: 1.12;
  letter-spacing: -0.03em;
}
.meta {
  margin-top: 30px;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-weight: 500;
  font-size: 22px;
  letter-spacing: 0.03em;
  color: var(--text-muted);
}

.phone {
  position: absolute;
  right: 130px;
  top: 78px;
  width: 340px;
  height: 736px;
  background: var(--bezel);
  border: 1px solid var(--bezel-edge);
  border-radius: 24px;
  box-shadow: 0 30px 70px rgba(0,0,0,.55);
  padding: 12px;
}
.phone .screen {
  width: 100%;
  height: 100%;
  border-radius: 14px;
  overflow: hidden;
  background: #141413;
}
.phone .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

.disclaimer {
  position: absolute;
  left: 80px;
  bottom: 56px;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-weight: 400;
  font-size: 16px;
  letter-spacing: 0.02em;
  color: var(--text-muted);
}
</style>
</head>
<body>

<div class="wordmark">
  <svg viewBox="28 24 74 82" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="44" cy="36" rx="9" ry="10" fill="#a3bd68" stroke="#141413" stroke-width="2.5"/>
    <ellipse cx="86" cy="36" rx="9" ry="10" fill="#a3bd68" stroke="#141413" stroke-width="2.5"/>
    <path d="M31 66 Q31 38 60 38 L70 38 Q99 38 99 66 L101 90 Q101 102 87 102 L43 102 Q29 102 29 90 Z" fill="#b5cd7a" stroke="#141413" stroke-width="2.5"/>
    <ellipse cx="51" cy="66" rx="8" ry="9.5" fill="#141413"/>
    <ellipse cx="79" cy="66" rx="8" ry="9.5" fill="#141413"/>
    <circle cx="54" cy="62" r="3" fill="#faf9f5"/>
    <circle cx="82" cy="62" r="3" fill="#faf9f5"/>
    <path d="M57 82 Q65 88 73 82" fill="none" stroke="#141413" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <span>Onramp</span>
</div>

<div class="stage">
  <div class="copy">
    <div class="headline">my max sub ends today. here's what i built with it.</div>
    <div class="meta">onramp &middot; unofficial guide to claude &middot; free</div>
  </div>
</div>

<div class="phone">
  <div class="screen"><img src="{{SCREENSHOT}}" /></div>
</div>

<div class="disclaimer">Unofficial. Not affiliated with Anthropic.</div>

</body>
</html>
