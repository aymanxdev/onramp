- id: fix-bug
  title: Fix a bug in my repo
  persona: engineer
  tags:
  - bug
  - repo
  - fix
  - debugging
  intent:
  - bug
  - fix a bug in my repo
  - repo
  - codebase
  - debug
  - error
  - stack trace
  - fix
  routes:
  - surface: code
    weight: 10
  - surface: chat
    weight: 4
  promptTemplate: 'Here is the bug: {{description}}. Find the cause in this repository and fix it, keeping
    the change as small as {{scope}}.'
  placeholders:
  - key: description
    label: the bug report or error
    defaultValue: the bug report or error
  - key: scope
    label: possible
    defaultValue: possible
  followUps:
  - Write a regression test that would have caught this.
  - Explain the root cause in plain language for the ticket.
  pitfalls:
  - Give it a way to reproduce the bug. A guess without a repro step is a guess.
  - Review the diff before merging. It edits real files with your permission, not blind trust.
  why:
  - Code reads and edits your actual repository, not a pasted snippet.
  - It can run your tests to check the fix before you do.
  - You approve each file change, so nothing merges without you seeing it.
  setup:
  - text: Install Code and sign in
    note: docs.claude.com, Claude Code overview
    href: https://docs.claude.com/en/docs/claude-code/overview
  - text: Run it inside your repository
    note: cd into the project first
  - text: Give it the failing test or error message
    note: the more specific, the faster the fix
  capabilities:
  - plugins
  connectors:
  - github
  skills:
  - code-review
  planNote: Code sits on the paid personal plans as of 7 September 2026
  alternative:
    surface: chat
