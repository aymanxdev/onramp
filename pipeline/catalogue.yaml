  officialUrl: https://claude.com
  asOf: '2026-09-07'
  summary: The organisation wide plan with the widest connector and governance controls.
usecases:
- id: tidy-inbox
  title: Tidy my inbox every morning
  persona: ops or admin
  tags:
  - inbox
  - email
  - morning routine
  - triage
  intent:
  - inbox
  - email
  - mail
  - reply
  - replies
  - triage
  - morning
  - tidy
  - digest
  - automate
  - automate my inbox
  - unread
  - needs a reply
  - today
  routes:
  - surface: cowork
    weight: 10
  - surface: outlook
    weight: 4
  promptTemplate: 'Every weekday at 08:00, read my unread mail from the last 24 hours. Group it into three
    lists: needs a reply today, waiting on someone else, and safe to archive. For each item give me the
    sender, one line of context, and a suggested next step. Keep the whole thing under {{length}} and
    flag anything from {{sender}} first.'
  placeholders:
  - key: length
    label: 300 words
    defaultValue: 300 words
  - key: sender
    label: my manager
    defaultValue: my manager
  followUps:
  - Draft replies for the “needs a reply today” list, but do not send them.
  - Every Friday, tell me who I have kept waiting the longest.
  pitfalls:
  - It will not send replies unless you ask it to. Keep it read only until you trust the summary.
  - Very large mailboxes get truncated. Give it a window, not your whole archive.
  why:
  - Cowork can hold a job that repeats, so you set it up once rather than asking each day.
  - Your mail already lives in Microsoft 365, and there is a connector for it.
  - Nothing here needs code, so you can undo it from the same screen you set it up in.
  setup:
  - text: Open Cowork in the sidebar
    note: support.claude.com, getting started with Cowork
    href: https://support.claude.com/en/articles/13345190-getting-started-with-cowork
  - text: Connect Microsoft 365
    note: Settings, Connectors, Microsoft 365
    href: https://claude.com/connectors
  - text: Allow read access to mail only
    note: read scope is enough for this route
  - text: Save the prompt as a task at 08:00
    note: weekdays only
  capabilities:
  - scheduled-tasks
  - connectors
  connectors:
  - microsoft-365
  skills: []
  planNote: Connectors and scheduled tasks sit on the paid personal plans as of 7 September 2026
  alternative:
    surface: outlook
    text: If you would rather stay inside your mail client, use Claude in Outlook and ask for the same
      summary by hand each morning. Slower, but nothing to connect.
  extra: + M365 + task
