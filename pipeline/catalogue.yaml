  - The output is a real spreadsheet you can open straight away.
  - You keep the source receipts exactly where they already are.
  setup:
  - text: Open Cowork in the sidebar
    note: support.claude.com, getting started with Cowork
    href: https://support.claude.com/en/articles/13345190-getting-started-with-cowork
  - text: Point it at your receipts folder
    note: a local folder or a connected drive both work
  - text: Ask for a spreadsheet, not a summary
    note: the xlsx skill loads on its own
  capabilities:
  - file-creation
  connectors:
  - google-drive
  skills:
  - xlsx
  planNote: File creation in Cowork sits on the paid personal plans as of 7 September 2026
  alternative:
    surface: excel
    text: Type the receipt totals into Excel by hand, or ask Claude for Excel to build the sheet once
      you have the numbers.
