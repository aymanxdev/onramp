- id: expense-sort
  title: Sort receipts into an expense spreadsheet
  persona: ops or admin
  tags:
  - expenses
  - receipts
  - spreadsheet
  - files
  intent:
  - receipts
  - expenses
  - expense
  - spreadsheet
  - sort my receipts into a spreadsheet
  - csv
  - sheet
  - files
  - folders
  routes:
  - surface: cowork
    weight: 10
  - surface: excel
    weight: 4
  promptTemplate: 'Read the receipts in {{folder}} and build a spreadsheet with one row per receipt: date,
    vendor, amount, category. Flag anything that looks like a duplicate.'
  placeholders:
  - key: folder
    label: my Receipts folder
    defaultValue: my Receipts folder
  followUps:
  - Total the amounts by category.
  - Convert any receipt in a foreign currency using that day's rate.
  pitfalls:
  - Handwritten receipts and blurry photos are read less reliably than printed ones.
  - It categorises by best guess. Check the category column before you submit anything.
  why:
