- id: monthly-api-credits
  name: Monthly API credits
  surface:
  - api
  plainWords: Max and Team plans now include monthly credits for building your own apps and agents on the API.
  whatItIs: A monthly credit on the Claude Platform for Max and Team subscribers, claimed by linking a
    Console organisation, that covers API calls, managed agents and the Agent SDK.
  whoItIsFor: For Max and Team subscribers who build their own tools.
  forChips:
  - Max and Team
  - Monthly
  - Claim in settings
  bullets:
  - Max 5x gets $100 and Max 20x gets $200 each month.
  - Team gets $20 per Standard seat and $100 per Premium seat, pooled up to $500.
  - Unused credit expires at the end of each billing cycle.
