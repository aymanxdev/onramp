  routes:
  - surface: code
    weight: 10
  - surface: chat
    weight: 4
  promptTemplate: Refactor {{module}} to be easier to read, without changing its behaviour. Run the test
    suite after every meaningful change and stop if anything goes red.
  placeholders:
  - key: module
    label: the module or file
    defaultValue: the module or file
  followUps:
  - Explain what changed and why, for the pull request description.
  - Suggest the next module that would benefit from the same treatment.
  pitfalls:
  - A refactor is only as safe as the test coverage that already exists. Thin tests, thin safety net.
  - Large refactors are easier to review in small commits. Ask for the change in steps.
  why:
  - Code can run the real test suite after each change, not just describe one.
  - It edits actual files, so the result is a real diff, not advice to copy out.
  - You see each step, so you can stop it if the direction is wrong.
  setup:
  - text: Install Code and sign in
    note: docs.claude.com, Claude Code overview
    href: https://docs.claude.com/en/docs/claude-code/overview
  - text: Run it inside your repository
    note: make sure the test command works first
  - text: Point it at the module to refactor
    note: name the file or folder
  capabilities:
  - plugins
  connectors:
  - github
  skills:
  - code-review
  planNote: Code sits on the paid personal plans as of 7 September 2026
  alternative:
    surface: chat
