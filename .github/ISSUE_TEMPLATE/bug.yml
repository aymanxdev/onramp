name: Bug
description: Something is broken in the app
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, and what you expected }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device, OS and browser }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: Page URL }
