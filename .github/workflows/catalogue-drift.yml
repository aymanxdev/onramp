name: catalogue-drift

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch release notes and diff against last snapshot
        id: diff
        run: python pipeline/drift.py --source https://support.claude.com/en/articles/12138966-release-notes --snapshot pipeline/snapshots/release-notes.md --out drift.md
      - name: Open an issue if anything changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: "Catalogue drift: Claude release notes changed"
          content-filepath: drift.md
          labels: catalogue, needs-owner
          assignees: aymanxdev
