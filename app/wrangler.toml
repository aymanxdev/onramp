name = "onramp"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (TURNSTILE_SECRET_KEY, ANTHROPIC_API_KEY, IP_HASH_SALT_SEED) are never set here.
# Set them with `wrangler pages secret put <NAME>` against the Pages project, once per
# environment. Production also sets its own [vars] in the Cloudflare dashboard, overriding
# the preview values below; this file only describes the preview/local defaults.

[[kv_namespaces]]
binding = "ONRAMP_KV"
id = "replace-with-the-production-kv-namespace-id"
preview_id = "replace-with-the-preview-kv-namespace-id"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "preview"
# Preview never calls a model: no budget can be spent from a public PR preview deploy.
LLM_PROVIDER = "none"
