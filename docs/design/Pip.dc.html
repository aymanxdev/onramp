<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Mascot master, as delivered in the Claude Design project "Onramp design system".
  The app renders these paths from app/src/design-system/mascot/Mascot.tsx.
  States: idle, thinking, found, confused, sleeping, waving, mark.
  Palette: body #b5cd7a, ears and feet #a3bd68, line #141413, map #f2c94c, cheeks #d97757 at 50%.
-->
<x-dc>
<helmet>
<style>
@keyframes m-breathe{0%,100%{transform:rotate(-1.5deg) scale(1,1)}50%{transform:rotate(-1.5deg) scale(1.015,.985)}}
@keyframes m-read{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-1deg)}}
@keyframes m-mapjiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes m-hop{0%,100%{transform:translateY(0) rotate(-3deg)}20%{transform:translateY(3px) rotate(0deg) scale(1.06,.93)}52%{transform:translateY(-15px) rotate(-6deg) scale(.95,1.06)}78%{transform:translateY(0) rotate(-2deg) scale(1.03,.97)}}
@keyframes m-armup{0%,100%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-5px) rotate(-24deg)}}
@keyframes m-tilt{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(-5deg)}}
@keyframes m-slump{0%,100%{transform:translateY(4px) scale(1,.96)}50%{transform:translateY(4px) scale(1.012,.945)}}
@keyframes m-wave{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(30deg)}}
@keyframes m-spark{0%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes m-z{0%{opacity:0;transform:translate(0,0) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-20px) scale(1.05)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<p style="font-family:monospace">See app/src/design-system/mascot/Mascot.tsx for the canonical SVG per state. This file records the source of truth reference and the keyframes above.</p>
</x-dc>
</body>
</html>
